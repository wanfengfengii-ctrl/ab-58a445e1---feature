services:
  # 常驻 Web 服务: FastAPI 托管 API 与前端静态产物, 带健康检查。
  web:
    build:
      context: .
      target: runtime
    image: archive-reconstruction:latest
    ports:
      # 宿主机端口可通过环境变量 HOST_PORT 配置, 默认 8080。
      - "${HOST_PORT:-8080}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # 一次性验收服务: 运行代码测试、前端构建与 API 冒烟, 自行退出并用退出码报告结果。
  # 用法: HOST_PORT=9000 docker compose --profile verify run --rm verify
  verify:
    profiles: ["verify"]
    build:
      context: .
      target: verify
    image: archive-reconstruction-verify:latest
    restart: "no"
